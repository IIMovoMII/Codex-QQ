name: 发布配套 QQ 网关

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '新发布标签，例如 v1.5.0-desktop-control.6；已存在的标签会拒绝覆盖'
        required: true
        default: v1.5.0-desktop-control.6
        type: string

permissions:
  contents: write

concurrency:
  group: gateway-release
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并发布 Windows x64 网关
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      GATEWAY_VERSION: 1.5.0-desktop-control.6
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: 核对发布标签与网关版本
        shell: pwsh
        run: |
          $expected = "v$env:GATEWAY_VERSION"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "发布标签必须是 $expected；当前输入 $env:RELEASE_TAG 与二进制内部版本不一致，已停止。"
          }
      - name: 核对基线、应用补丁并运行网关专项测试
        run: python -X utf8 tools/ci_build_gateway.py --version $env:GATEWAY_VERSION
      - name: 打包网关、来源信息和校验文件
        shell: pwsh
        run: |
          python -X utf8 tools/package_gateway_release.py `
            --binary vendor/cc-connect/v1.5.0-desktop-control/bin/cc-connect-desktop-control.exe `
            --output-dir dist `
            --release-tag $env:RELEASE_TAG `
            --gateway-version $env:GATEWAY_VERSION
      - name: 发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "发布标签已存在，拒绝覆盖：$tag" }
          $notes = @"
          Codex-QQ 配套 CC Connect 网关。

          - 仅包含本项目适配的 ACP 与 QQ 通道。
          - 来源、上游固定提交、补丁说明和二进制 SHA-256 在压缩包内。
          - 安装请运行仓库内的 install.cmd。
          - 这是 Codex-QQ 的配套组件，不是未打补丁的上游 cc-connect.exe。
          "@
          Set-Content -Path dist/RELEASE_NOTES.md -Value $notes -Encoding utf8
          gh release create $tag `
            dist/codex-qq-gateway-windows-x64-$tag.zip `
            dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Codex-QQ $tag" `
            --notes-file dist/RELEASE_NOTES.md
