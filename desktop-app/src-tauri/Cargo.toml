[package]
name = "codex-qq-desktop"
version = "1.0.3"
description = "Codex QQ 助手桌面应用"
authors = ["Codex QQ"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
